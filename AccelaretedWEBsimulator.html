<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Object Scanner & Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            color: #fff;
        }
        #viewport {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        video {
            display: none;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .header {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }
        .title {
            font-size: 15px;
            font-weight: 600;
            color: #00f0ff;
        }
        .stats {
            font-size: 13px;
            color: #aaa;
        }
        .controls {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            margin: 0 auto;
            max-width: 95%;
            flex-wrap: wrap;
        }
        .btn {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-capture {
            background: #00f0ff;
            color: #000;
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }
        .btn-danger {
            background: rgba(255, 50, 50, 0.3);
            border-color: #ff3333;
            color: #ff6666;
        }
        #reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            border: 2px dashed rgba(0, 240, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.3s;
        }
        #reticle::after {
            content: 'ПОМЕСТИТЕ ПРЕДМЕТ СЮДА';
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #00f0ff;
            letter-spacing: 1px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="reticle"></div>
    <video id="webcam" autoplay playsinline></video>

    <div id="hud">
        <div class="header">
            <div class="title">3D OBJECT SCANNER</div>
            <div class="stats" id="info-text">Кадров: 0 | Точек: 0</div>
        </div>

        <div class="controls">
            <button class="btn btn-capture" onclick="captureFrame()">📸 Сделать ракурс</button>
            <button class="btn" id="btn-view" onclick="toggleViewMode()">🔄 3D Обзор</button>
            <button class="btn btn-danger" onclick="clearScan()">🗑 Сбросить</button>
        </div>
    </div>

    <!-- Three.js & Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let video = document.getElementById('webcam');
        let infoText = document.getElementById('info-text');
        let reticle = document.getElementById('reticle');

        // Обработка пикселей
        const sampleCanvas = document.createElement('canvas');
        const sampleCtx = sampleCanvas.getContext('2d');
        const RES_X = 80;
        const RES_Y = 80;
        sampleCanvas.width = RES_X;
        sampleCanvas.height = RES_Y;

        // Память 3D точек
        const MAX_POINTS = 300000;
        let lidarPositions = new Float32Array(MAX_POINTS * 3);
        let lidarColors = new Float32Array(MAX_POINTS * 3);
        let totalCapturedPoints = 0;
        let capturedFramesCount = 0;
        let isOrbitMode = false;

        let pointGeometry, pointMaterial, pointCloud;

        function init() {
            const container = document.getElementById('viewport');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050508);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enabled = false;
            controls.enableDamping = true;

            // Буфер облака точек
            pointGeometry = new THREE.BufferGeometry();
            pointGeometry.setAttribute('position', new THREE.BufferAttribute(lidarPositions, 3));
            pointGeometry.setAttribute('color', new THREE.BufferAttribute(lidarColors, 3));

            pointMaterial = new THREE.PointsMaterial({
                size: 0.35,
                vertexColors: true,
                transparent: true,
                opacity: 0.9
            });

            pointCloud = new THREE.Points(pointGeometry, pointMaterial);
            scene.add(pointCloud);

            initCamera();
            window.addEventListener('resize', onResize);
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                video.play();
            } catch (err) {
                alert('Не удалось получить доступ к камере.');
            }
        }

        // Захват кадра предмета с текущего ракурса
        function captureFrame() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

            sampleCtx.drawImage(video, 0, 0, RES_X, RES_Y);
            const imgData = sampleCtx.getImageData(0, 0, RES_X, RES_Y).data;

            // Угол поворота при каждом захвате (симуляция съемки по кругу)
            const angle = (capturedFramesCount * 45) * (Math.PI / 180);
            const radius = 25; 

            const camX = Math.sin(angle) * radius;
            const camZ = Math.cos(angle) * radius;

            let addedInThisFrame = 0;

            for (let y = 0; y < RES_Y; y++) {
                for (let x = 0; x < RES_X; x++) {
                    const i = (y * RES_X + x) * 4;
                    const r = imgData[i];
                    const g = imgData[i + 1];
                    const b = imgData[i + 2];

                    // Оценка глубины по ярким частям и объекту в центре
                    const brightness = (r * 0.299 + g * 0.587 + b * 0.114) / 255.0;
                    
                    // Фильтруем слишком темный фон
                    if (brightness < 0.15) continue;

                    const localX = (x - RES_X / 2) * 0.25;
                    const localY = -(y - RES_Y / 2) * 0.25;
                    const localZ = (brightness - 0.5) * 8.0;

                    // Трансформируем координаты относительно угла съемки
                    const worldX = localX * Math.cos(angle) + localZ * Math.sin(angle);
                    const worldY = localY;
                    const worldZ = -localX * Math.sin(angle) + localZ * Math.cos(angle);

                    const idx = (totalCapturedPoints % MAX_POINTS) * 3;
                    lidarPositions[idx] = worldX;
                    lidarPositions[idx + 1] = worldY;
                    lidarPositions[idx + 2] = worldZ;

                    lidarColors[idx] = r / 255.0;
                    lidarColors[idx + 1] = g / 255.0;
                    lidarColors[idx + 2] = b / 255.0;

                    totalCapturedPoints++;
                    addedInThisFrame++;
                }
            }

            capturedFramesCount++;
            pointGeometry.attributes.position.needsUpdate = true;
            pointGeometry.attributes.color.needsUpdate = true;
            pointGeometry.setDrawRange(0, Math.min(totalCapturedPoints, MAX_POINTS));

            infoText.innerText = `Кадров: ${capturedFramesCount} | Точек: ${totalCapturedPoints}`;
        }

        function toggleViewMode() {
            isOrbitMode = !isOrbitMode;
            controls.enabled = isOrbitMode;
            reticle.style.opacity = isOrbitMode ? '0' : '1';
            document.getElementById('btn-view').classList.toggle('btn-capture', isOrbitMode);

            if (!isOrbitMode) {
                camera.position.set(0, 0, 40);
                camera.lookAt(0, 0, 0);
            }
        }

        function clearScan() {
            totalCapturedPoints = 0;
            capturedFramesCount = 0;
            pointGeometry.setDrawRange(0, 0);
            infoText.innerText = `Кадров: 0 | Точек: 0`;
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isOrbitMode) controls.update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
